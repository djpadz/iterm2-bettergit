name: Release

# Run manually from the Actions tab to cut a signed release from the head of the default branch.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version component to bump
        type: choice
        required: true
        default: patch
        options:
          - major
          - minor
          - patch

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Compute next version
        id: version
        run: |
          current=$(git tag --list '[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)
          if [ -z "$current" ]; then
            current=$(sed -n 's/^version *= *//p' setup.cfg)
          fi
          IFS=. read -r major minor patch <<< "$current"
          case "${{ inputs.bump }}" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
          esac
          next="$major.$minor.$patch"
          if git rev-parse -q --verify "refs/tags/$next" >/dev/null; then
            echo "::error::Tag $next already exists"; exit 1
          fi
          echo "Releasing $current -> $next"
          echo "previous=$current" >> "$GITHUB_OUTPUT"
          echo "next=$next" >> "$GITHUB_OUTPUT"

      - name: Set up signing keychain
        id: keychain
        env:
          SIGNING_CERTIFICATE_P12_BASE64: ${{ secrets.SIGNING_CERTIFICATE_P12_BASE64 }}
          SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_pw=$(openssl rand -base64 32)
          p12="$RUNNER_TEMP/signing.p12"

          echo "$SIGNING_CERTIFICATE_P12_BASE64" | base64 --decode > "$p12"
          curl -fsSL -o "$RUNNER_TEMP/AppleWWDRCAG3.cer" https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer

          security create-keychain -p "$keychain_pw" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_pw" "$keychain"
          security import "$p12" -k "$keychain" -P "$SIGNING_CERTIFICATE_PASSWORD" -f pkcs12 -A
          # The .p12 may already include the WWDR intermediate, in which case this import is a duplicate.
          security import "$RUNNER_TEMP/AppleWWDRCAG3.cer" -k "$keychain" || echo "WWDR intermediate already present"
          security set-key-partition-list -S apple-tool:,apple:,unsigned: -s -k "$keychain_pw" "$keychain" >/dev/null
          # shellcheck disable=SC2046 # existing keychain paths are intentionally word-split
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm -f "$p12"

          identity=$(security find-identity -v -p codesigning "$keychain" | sed -n 's/.*"\(.*\)".*/\1/p' | head -n1)
          if [ -z "$identity" ]; then
            echo "::error::No signing identity found in the imported certificate"; exit 1
          fi
          echo "Signing as: $identity"
          echo "keychain=$keychain" >> "$GITHUB_OUTPUT"
          echo "identity=$identity" >> "$GITHUB_OUTPUT"

      - name: Bump version in setup.cfg
        run: sed -i '' -E 's/^version *=.*/version=${{ steps.version.outputs.next }}/' setup.cfg

      - name: Build and sign
        run: make SIGN="$GITHUB_WORKSPACE/tools/it2sign" SIGNING_CERT='"${{ steps.keychain.outputs.identity }}"'

      - name: Commit, tag, and push
        run: |
          next="${{ steps.version.outputs.next }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet setup.cfg; then
            git commit -m "Release $next" setup.cfg
          fi
          git tag -a "$next" -m "Release $next"
          git push origin HEAD "$next"

      - name: Create GitHub release
        run: |
          next="${{ steps.version.outputs.next }}"
          prev="${{ steps.version.outputs.previous }}"
          notes_args=(--generate-notes)
          if git rev-parse -q --verify "refs/tags/$prev" >/dev/null; then
            notes_args+=(--notes-start-tag "$prev")
          fi
          url=$(gh release create "$next" bettergit.its --title "$next" "${notes_args[@]}")
          echo "Released [$next]($url)" >> "$GITHUB_STEP_SUMMARY"

      - name: Clean up keychain
        if: always() && steps.keychain.outputs.keychain != ''
        run: security delete-keychain "${{ steps.keychain.outputs.keychain }}"
